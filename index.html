  <style>
    *{

    body{

      color:#fff;

    .wrap{
      max-width:1300px;
      margin:auto;
      padding:26px 34px 40px;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{

      justify-content:space-between;
      align-items:center;
      gap:20px;
    }

    .logoHeader{
      height:62px;
      width:auto;
      display:block;
      filter:drop-shadow(0 0 10px rgba(0,0,0,0.65));
    }

    .topBtn{
      background:#f0c548;
      color:#111;
      text-decoration:none;
      font-weight:800;
      border-radius:18px;
      padding:18px 28px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      box-shadow:0 8px 24px rgba(0,0,0,0.30);
      transition:transform .2s ease, box-shadow .2s ease;
    }

    .topBtn:hover{
      transform:translateY(-2px) scale(1.02);
      box-shadow:0 12px 28px rgba(0,0,0,0.36);
    }

    .hero{
      flex:1;
      display:grid;
      grid-template-columns:1.05fr 0.95fr;
      align-items:center;
      gap:40px;
      padding-top:40px;
    }

    .left{
      max-width:700px;
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(36px, 5vw, 62px);
      line-height:1.05;
      font-weight:800;
      text-shadow:0 3px 14px rgba(0,0,0,0.45);
    }

    .sub{
      margin:0 0 24px;
      font-size:clamp(20px, 2vw, 30px);
      line-height:1.3;
      color:#f2f2f2;
      text-shadow:0 2px 10px rgba(0,0,0,0.35);
    }

    .badges{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-bottom:34px;
    }

    .badge{
      background:#090909;
      color:#fff;
      padding:14px 22px;
      border-radius:999px;
      font-size:clamp(15px, 1.1vw, 19px);
      font-weight:700;
      box-shadow:0 5px 16px rgba(0,0,0,0.28);
    }

    .ctaGroup{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:16px;
    }

    .btn{
      min-width:290px;
      padding:20px 28px;
      border-radius:18px;
      text-decoration:none;
      font-size:clamp(20px, 1.4vw, 28px);
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      box-shadow:0 10px 28px rgba(0,0,0,0.28);
      transition:transform .22s ease, box-shadow .22s ease;
      animation:pulse 1.8s infinite;
    }

    .btn:hover{
      transform:scale(1.04);
      box-shadow:0 14px 34px rgba(0,0,0,0.35);
    }

    .btnPrimary{
      background:#f0c548;
      color:#111;
    }

    .btnSecondary{
      background:#fff;
      color:#111;
    }

    .right{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logoMain{
      width:min(100%, 420px);
      height:auto;
      display:block;
      filter:drop-shadow(0 0 24px rgba(0,0,0,0.6));
    }

    .waFloat{
      position:fixed;
      right:24px;
      bottom:24px;
      width:72px;
      height:72px;
      border-radius:50%;
      background:#25D366;
      color:#fff;
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      box-shadow:0 10px 24px rgba(0,0,0,0.35);
      animation:bounce 1.4s infinite;
      z-index:99;
    }

    @keyframes pulse{
      0%,100%{transform:scale(1);}
      50%{transform:scale(1.05);}
    }

    @keyframes bounce{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-7px);}
    }

    @media (max-width: 980px){
      .wrap{
        padding:22px 18px 34px;
      }

      .hero{
        grid-template-columns:1fr;
        gap:28px;
        padding-top:26px;
      }

      .right{
        order:-1;
      }

      .logoMain{
        max-width:300px;
      }

      .ctaGroup{
        width:100%;
      }

      .btn{
        width:100%;
        min-width:0;
      }

      .topBtn{

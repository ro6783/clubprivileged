  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      color:#fff;
      min-height:100vh;
      background:
        linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.28)),
        url('fondo.jpg') no-repeat center center fixed;
      background-size:cover;
    }

    .wrap{
      max-width:1300px;
      margin:auto;
      padding:26px 34px 40px;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{
      display:flex;
      justify-content:flex-start;
      align-items:center;
      gap:20px;
    }

    .logoHeader{
      height:62px;
      width:auto;
      display:block;
      filter:drop-shadow(0 0 10px rgba(0,0,0,0.65));
    }

    .topBtn{
      background:#f0c548;
      color:#111;
      text-decoration:none;
      font-weight:800;
      border-radius:18px;
      padding:18px 28px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      box-shadow:0 8px 24px rgba(0,0,0,0.30);
      transition:transform .2s ease, box-shadow .2s ease;
      animation:pulse 1.8s infinite;
    }

    .topBtn:hover{
      transform:translateY(-2px) scale(1.02);
      box-shadow:0 12px 28px rgba(0,0,0,0.36);
    }

    .hero{
      flex:1;
      display:grid;
      grid-template-columns:1.05fr 0.95fr;
      align-items:center;
      gap:40px;
      padding-top:40px;
    }

    .left{
      max-width:700px;
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(36px, 5vw, 62px);
      line-height:1.05;
      font-weight:800;
      text-shadow:0 3px 14px rgba(0,0,0,0.45);
    }

    .sub{
      margin:0 0 24px;
      font-size:clamp(20px, 2vw, 30px);
      line-height:1.3;
      color:#f2f2f2;
      text-shadow:0 2px 10px rgba(0,0,0,0.35);
    }

    .badges{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-bottom:34px;
    }

    .badge{
      background:#090909;
      color:#fff;
      padding:14px 22px;
      border-radius:999px;
      font-size:clamp(15px, 1.1vw, 19px);
      font-weight:700;
      box-shadow:0 5px 16px rgba(0,0,0,0.28);
    }

    .ctaGroup{
      display:flex;
      justify-content:center;
      align-items:center;
      width:100%;
      margin-top:10px;
    }

    .botonCentral{
      font-size:clamp(24px, 2vw, 34px);
      padding:22px 40px;
      border-radius:20px;
      min-width:320px;
      min-height:72px;
      text-align:center;
    }

    .right{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logoMain{
      width:min(100%, 420px);
      height:auto;
      display:block;
      filter:drop-shadow(0 0 24px rgba(0,0,0,0.6));
    }

    @keyframes pulse{
      0%,100%{transform:scale(1);}
      50%{transform:scale(1.05);}
    }

    @media (max-width: 980px){
      .wrap{
        padding:22px 18px 34px;
      }

      .hero{
        grid-template-columns:1fr;
        gap:28px;
        padding-top:26px;
      }

      .right{
        order:-1;
      }

      .logoMain{
        max-width:300px;
      }

      .ctaGroup{
        width:100%;
      }

      .topBtn{
        width:100%;
      }

      .botonCentral{
        width:100%;
        min-width:0;
      }

      .logoHeader{
        height:48px;
      }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <header>
      <img src="logo.png" class="logoHeader" alt="Club Privileged">
    </header>

    <section class="hero">
      <div class="left">
        <h1>Atención 24 hs y carga 24/7</h1>

        <p class="sub">
          Pedí acceso por WhatsApp y empezá a jugar en minutos.
        </p>

          <span class="badge">Respuesta inmediata</span>

     href="https://wa.me/5491122928072?text=HolA%20quiero%20jugar%20con%20mi%20bon0%20del%2050%25"

     onclick="fbq('trackCustom', 'ClickWhatsApp')">
    📲 ¡ JUGA Y GANA !
     </a>
          </a>
        </div>
      </div>

      <div class="right">
        <img src="logo.png" class="logoMain" alt="Club Privileged">
      </div>
    </section>
  </div>

</body>
